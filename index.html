<!-- CURRENT AIR PEEK BASELINE: rebuilt implementation with choice/gauge voting, persistent posts, comments, images, and post-flow safeguards. -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Air Peek</title>
<style>
:root{--sky:#dff3fa;--white:#fff;--text:#202528;--muted:#71838a;--line:#d8e7ec;--orange:#e8b85c;--teal:#58b8aa;--teal-soft:#dcefeb;--dark:#2f3437}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:var(--text);background:var(--sky)}body{overflow:hidden}button,input,textarea{font:inherit}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.topbar{position:fixed;inset:0 0 auto 0;height:64px;background:rgba(255,255,255,.96);display:flex;justify-content:center;align-items:center;gap:6px;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.05)}.tab{border:0;background:transparent;color:#58717d;padding:9px 12px;border-radius:20px;cursor:pointer}.tab.active{background:#8fccef;color:#fff}.tab:not(.active):hover{background:#f0f2f3}.counter{position:fixed;top:76px;right:16px;z-index:19;background:#fff;border-radius:18px;padding:6px 10px;font-size:12px;color:#58717d;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.feed{height:100vh;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.feed::-webkit-scrollbar{display:none}.post{height:100vh;scroll-snap-align:start;display:flex;justify-content:center;align-items:center;padding:84px 16px 92px}.card{width:min(500px,100%);max-height:calc(100vh - 120px);overflow:auto;background:#fff;border-radius:20px;padding:24px 18px;box-shadow:0 4px 15px rgba(0,0,0,.07)}
.category{display:inline-block;font-size:12px;color:#496674;background:#e5f4f9;border-radius:20px;padding:6px 10px;margin-bottom:18px}.question-box{background:#fff;border:1px solid #e3ecef;border-radius:16px;padding:18px 14px;box-shadow:0 3px 10px rgba(120,100,70,.06);margin-bottom:26px}.question{margin:0;font-size:21px;font-weight:750;line-height:1.5;text-align:center}
.two-choice{display:flex;flex-direction:column;gap:10px;align-items:center}.choice-btn{width:min(320px,92%);min-height:54px;padding:12px 16px;border:2px solid #3f474b;background:#fff;border-radius:16px;cursor:pointer;box-shadow:0 3px 8px rgba(70,90,98,.08);transition:.12s;display:flex;align-items:center;justify-content:center;gap:12px}.choice-btn:not(:disabled):hover{transform:translateY(-1px);border-color:#252a2d}.choice-btn:not(:disabled):active{transform:scale(.98)}.choice-btn.selected{background:var(--dark);border-color:var(--dark);color:#fff}.choice-btn:disabled{cursor:default}.choice-label{font-size:15px;font-weight:800;line-height:1.25;flex:1;text-align:center}.choice-percent{display:none;font-size:15px;font-weight:800;line-height:1;white-space:nowrap;color:var(--dark)}.choice-btn.result .choice-label{flex:1;text-align:left}.choice-btn.result .choice-percent{display:inline-flex}.choice-btn.selected .choice-percent{color:#fff}
.gauge-wrap{padding:4px 2px 2px}.gauge-labels{display:grid;grid-template-columns:1fr 1fr;gap:18px;font-size:13px;color:#48575d;line-height:1.3;margin-bottom:12px}.gauge-labels .left{text-align:left}.gauge-labels .right{text-align:right}.gauge-track{position:relative;height:8px;border-radius:999px;background:var(--teal-soft)}.gauge-fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--teal);pointer-events:none}.gauge-dot{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#3c9d91;border:3px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.16);pointer-events:none;transition:transform .1s}.gauge-hit{position:absolute;inset:-12px 0;cursor:pointer;touch-action:none}
.comment-area{margin-top:20px;text-align:left;border-top:1px solid #eef4f6;padding-top:10px}.comment-button{width:100%;display:flex;align-items:center;justify-content:flex-end;gap:7px;border:0;background:transparent;color:#58717d;padding:8px 0;cursor:pointer}.comment-icon{width:27px;height:27px;display:inline-flex;color:#2f3437}.comment-icon svg{width:100%;height:100%}.comments{display:none;margin-top:6px;padding:12px;background:#f7fcfe;border:1px solid #d5e8ee;border-radius:14px}.comments.show{display:block}.comments-list{max-height:150px;overflow:auto}.comment-item{font-size:13px;line-height:1.5;padding:8px 0;border-bottom:1px solid #e5f0f3}.comment-item:last-child{border-bottom:0}.comment-empty{text-align:center;color:#8aa0a9;font-size:13px;padding:6px 0}.comment-form{display:flex;gap:8px;margin-top:8px}.comment-input{flex:1;min-width:0;border:1px solid #d5e8ee;border-radius:12px;padding:10px 12px}.comment-submit{border:0;border-radius:12px;padding:0 14px;background:#8fccef;color:#fff;font-weight:700;cursor:pointer}
.add-btn{position:fixed;right:18px;bottom:18px;width:62px;height:62px;border:0;border-radius:50%;background:var(--orange);color:#536873;font-size:28px;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:30;cursor:pointer}
.overlay{position:fixed;inset:0;background:var(--sky);z-index:50;display:none;overflow:auto}.overlay.open{display:block}.form-wrap{width:min(500px,92%);margin:0 auto;padding:22px 0 40px}.form-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.form-head h2{margin:0}.close{width:40px;height:40px;border:0;border-radius:50%;background:#fff;font-size:21px;cursor:pointer}.field{margin-bottom:22px}.field-title{font-size:13px;font-weight:800;margin-bottom:9px}.type-row{display:flex;gap:10px}.type-btn{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;cursor:pointer;color:#58717d}.type-btn.active{background:var(--orange);border-color:var(--orange);color:#fff}.type-btn:not(.active):hover{background:#f0f2f3}.type-btn.active:hover{background:#d9aa4f;border-color:#d9aa4f}.input,.textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px 14px;outline:none}.textarea{height:120px;resize:none}.input:focus,.textarea:focus{border-color:#8fccef}.two-inputs{display:flex;flex-direction:column;gap:10px}.gauge-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.preview{margin-top:12px;border:1px solid #dbe8eb;border-radius:14px;background:#fff;padding:12px}.preview-labels{display:grid;grid-template-columns:1fr 1fr;gap:18px;font-size:12px;color:#54646a}.preview-labels .left{text-align:left}.preview-labels .right{text-align:right}.preview-bar{height:7px;border-radius:99px;background:linear-gradient(to right,var(--teal-soft),var(--teal));margin-top:9px}.image-label{display:flex;align-items:center;justify-content:center;min-height:50px;border:1px dashed #b7d6e0;border-radius:14px;background:rgba(255,255,255,.75);color:#58717d;font-size:14px;font-weight:700;cursor:pointer}.image-input{display:none}.image-preview{display:none;position:relative;margin-top:10px}.image-preview.show{display:block}.image-preview img{width:100%;display:block;border-radius:14px;border:1px solid var(--line)}.remove-image{position:absolute;right:8px;top:8px;width:34px;height:34px;border:0;border-radius:50%;background:rgba(50,60,65,.8);color:#fff;cursor:pointer}.submit{width:100%;border:0;border-radius:14px;background:var(--orange);color:#fff;padding:15px;font-size:16px;font-weight:800;cursor:pointer}.submit:disabled{opacity:.65;cursor:default}.empty{height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;color:#58717d;padding:30px}
@media(max-width:420px){.post{padding-left:12px;padding-right:12px}.card{padding:20px 14px}.question{font-size:20px}.type-btn{padding:11px 8px}.gauge-inputs{gap:8px}}
</style>
</head>
<body>
<div class="topbar"><button class="tab active" data-cat="all">すべて</button><button class="tab" data-cat="流行・話題">流行・話題</button><button class="tab" data-cat="共感・あるある">共感・あるある</button><button class="tab" data-cat="意見・価値観">意見・価値観</button></div>
<div class="counter" id="counter">0 / 0</div><div class="feed" id="feed"></div><button class="add-btn" id="openPost" aria-label="投稿する">＋</button>
<div class="overlay" id="postOverlay"><div class="form-wrap">
  <div class="form-head"><h2>新しい投稿</h2><button class="close" id="closePost">×</button></div>
  <div class="field"><div class="field-title">カテゴリ</div><div class="type-row" id="categoryRow"><button class="type-btn active" data-category="流行・話題">流行・話題</button><button class="type-btn" data-category="共感・あるある">共感・あるある</button><button class="type-btn" data-category="意見・価値観">意見・価値観</button></div></div>
  <div class="field"><div class="field-title">投稿形式</div><div class="type-row" id="formatRow"><button class="type-btn active" data-format="choice">2択</button><button class="type-btn" data-format="gauge">ゲージ</button></div></div>
  <div class="field"><div class="field-title">お題</div><textarea class="textarea" id="questionInput" maxlength="120" placeholder="みんなに聞いてみたいこと"></textarea></div>
  <div class="field"><div class="field-title">画像（任意）</div><label class="image-label" for="imageInput">＋ 画像を追加</label><input class="image-input" id="imageInput" type="file" accept="image/*"><div class="image-preview" id="imagePreview"><img id="previewImg" alt="選択した画像"><button class="remove-image" id="removeImage">×</button></div></div>
  <div class="field" id="choiceField"><div class="two-inputs"><input class="input" id="choiceA" maxlength="20" placeholder="選択肢A"><input class="input" id="choiceB" maxlength="20" placeholder="選択肢B"></div></div>
  <div class="field" id="gaugeField" hidden><div class="gauge-inputs"><input class="input" id="gaugeLeft" maxlength="20" placeholder="左端の言葉"><input class="input" id="gaugeRight" maxlength="20" placeholder="右端の言葉"></div><div class="preview"><div class="preview-labels"><div class="left" id="previewLeft">左端の言葉</div><div class="right" id="previewRight">右端の言葉</div></div><div class="preview-bar"></div></div></div>
  <button class="submit" id="submitPost">投稿する</button>
</div></div>
<script>
(() => {
  'use strict';
  const POSTS_KEY='airpeek_posts_rebuild_v1';
  const MY_VOTES_KEY='airpeek_my_votes_rebuild_v1';
  const COMMENTS_KEY='airpeek_comments_rebuild_v1';
  const $=(s,r=document)=>r.querySelector(s);
  const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
  const uid=()=>`${Date.now()}-${Math.random().toString(36).slice(2)}`;
  const safe=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??f}catch{return f}};
  const esc=v=>String(v).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));

  let posts=safe(POSTS_KEY,[]);
  let myVotes=safe(MY_VOTES_KEY,{});
  let comments=safe(COMMENTS_KEY,{});
  let category='all', selectedCategory='流行・話題', selectedFormat='choice';
  let selectedImage=''; let submitting=false;

  function normalizePost(p){
    if(!p||!p.id||!p.question)return null;
    const format=p.format==='gauge'?'gauge':'choice';
    if(format==='choice') return {...p,format,a:String(p.a??''),b:String(p.b??''),votesA:Number.isFinite(p.votesA)?p.votesA:0,votesB:Number.isFinite(p.votesB)?p.votesB:0};
    return {...p,format,leftLabel:String(p.leftLabel??''),rightLabel:String(p.rightLabel??''),gaugeValues:Array.isArray(p.gaugeValues)?p.gaugeValues.filter(v=>Number.isFinite(v)):[]};
  }
  posts=posts.map(normalizePost).filter(Boolean);
  localStorage.setItem(POSTS_KEY,JSON.stringify(posts));

  function savePosts(){localStorage.setItem(POSTS_KEY,JSON.stringify(posts))}
  function saveVotes(){localStorage.setItem(MY_VOTES_KEY,JSON.stringify(myVotes))}
  function saveComments(){localStorage.setItem(COMMENTS_KEY,JSON.stringify(comments))}

  function commentSVG(){return '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M11 17.5C11 12.253 15.253 8 20.5 8h23C48.747 8 53 12.253 53 17.5v17C53 39.747 48.747 44 43.5 44H29l-11.5 10 2.4-10H20.5C15.253 44 11 39.747 11 34.5v-17Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="26" r="2.8" fill="currentColor"/><circle cx="32" cy="26" r="2.8" fill="currentColor"/><circle cx="40" cy="26" r="2.8" fill="currentColor"/></svg>'}

  function visiblePosts(){return category==='all'?posts:posts.filter(p=>p.category===category)}

  function render(){
    const feed=$('#feed'), list=visiblePosts();
    feed.innerHTML=''; $('#counter').textContent=`${list.length?1:0} / ${list.length}`;
    if(!list.length){feed.innerHTML='<div class="empty"><div><h2>まだ投稿がありません</h2><p>＋から最初のお題を投稿してみよう。</p></div></div>';return}
    list.forEach(post=>{
      const sec=document.createElement('section'); sec.className='post'; sec.dataset.id=post.id;
      const card=document.createElement('div'); card.className='card';
      card.innerHTML=`<div class="category">${esc(post.category)}</div><div class="question-box"><p class="question">${esc(post.question)}</p></div>${post.image?`<img src="${post.image}" alt="投稿画像" style="width:100%;border-radius:14px;display:block;margin:-4px 0 24px;border:1px solid var(--line)">`:''}<div class="vote-area"></div><div class="comment-area"><button class="comment-button ${myVotes[post.id]?'':'locked'}"><span class="comment-icon">${commentSVG()}</span><span class="comment-count">0</span></button><div class="comments"><div class="comments-list"></div><div class="comment-form"><input class="comment-input" maxlength="100" placeholder="コメントを書く"><button class="comment-submit">送信</button></div></div></div>`;
      const voteArea=$('.vote-area',card);
      if(post.format==='choice') renderChoice(voteArea,post); else renderGauge(voteArea,post);
      renderComments(card,post);
      sec.appendChild(card); feed.appendChild(sec);
    });
  }

  function renderChoice(root,post){
    const mine=myVotes[post.id]; const total=post.votesA+post.votesB; const pa=total?Math.round(post.votesA/total*100):0; const pb=total?100-pa:0;
    root.innerHTML=`<div class="two-choice"><button class="choice-btn ${mine?'result':''} ${mine?.value==='a'?'selected':''}" data-c="a" ${mine?'disabled':''}><span class="choice-label">${esc(post.a)}</span>${mine?`<span class="choice-percent">${pa}%</span>`:''}</button><button class="choice-btn ${mine?'result':''} ${mine?.value==='b'?'selected':''}" data-c="b" ${mine?'disabled':''}><span class="choice-label">${esc(post.b)}</span>${mine?`<span class="choice-percent">${pb}%</span>`:''}</button></div>`;
    if(!mine){$$('.choice-btn',root).forEach(b=>b.addEventListener('click',()=>voteChoice(post.id,b.dataset.c)))}
  }

  function voteChoice(id,c){
    if(myVotes[id])return;
    const post=posts.find(p=>p.id===id); if(!post||post.format!=='choice')return;
    if(c==='a')post.votesA+=1; else if(c==='b')post.votesB+=1; else return;
    myVotes[id]={type:'choice',value:c}; savePosts(); saveVotes(); render();
  }

  function renderGauge(root,post){
    const mine=myVotes[post.id]; const locked=mine?.type==='gauge'; const value=locked?mine.value:50;
    root.innerHTML=`<div class="gauge-wrap"><div class="gauge-labels"><div class="left">${esc(post.leftLabel)}</div><div class="right">${esc(post.rightLabel)}</div></div><div class="gauge-track"><div class="gauge-fill" style="width:${value}%"></div><div class="gauge-dot" style="left:${value}%"></div>${locked?'':'<div class="gauge-hit"></div>'}</div></div>`;
    if(locked)return;
    const hit=$('.gauge-hit',root), track=$('.gauge-track',root); let dragging=false, valueNow=50;
    const update=(x)=>{const r=track.getBoundingClientRect(); valueNow=Math.round(Math.max(0,Math.min(1,(x-r.left)/r.width))*100); $('.gauge-fill',root).style.width=valueNow+'%'; $('.gauge-dot',root).style.left=valueNow+'%'};
    hit.addEventListener('pointerdown',e=>{dragging=true;hit.setPointerCapture?.(e.pointerId);update(e.clientX)});
    hit.addEventListener('pointermove',e=>{if(dragging)update(e.clientX)});
    hit.addEventListener('pointerup',()=>{if(!dragging)return;dragging=false;voteGauge(post.id,valueNow)});
    hit.addEventListener('pointercancel',()=>{if(!dragging)return;dragging=false;voteGauge(post.id,valueNow)});
  }

  function voteGauge(id,value){
    if(myVotes[id])return;
    const post=posts.find(p=>p.id===id); if(!post||post.format!=='gauge')return;
    post.gaugeValues.push(value); myVotes[id]={type:'gauge',value}; savePosts(); saveVotes(); render();
  }

  function renderComments(card,post){
    const list=comments[post.id]||[]; const count=$('.comment-count',card); const panel=$('.comments',card); const btn=$('.comment-button',card); const items=$('.comments-list',card); const input=$('.comment-input',card); const send=$('.comment-submit',card);
    count.textContent=list.length; items.innerHTML=list.length?list.map(c=>`<div class="comment-item">${esc(c)}</div>`).join(''):'<div class="comment-empty">まだコメントはありません</div>';
    btn.addEventListener('click',()=>{if(!myVotes[post.id])return; const show=panel.classList.toggle('show');if(show)requestAnimationFrame(()=>panel.scrollIntoView({behavior:'smooth',block:'nearest'}))});
    send.addEventListener('click',()=>{if(!myVotes[post.id])return;const text=input.value.trim();if(!text)return;if(!comments[post.id])comments[post.id]=[];comments[post.id].push(text);saveComments();render()});
  }

  function resetForm(){
    submitting=false; const b=$('#submitPost'); b.disabled=false; b.textContent='投稿する';
    $('#questionInput').value='';$('#choiceA').value='';$('#choiceB').value='';$('#gaugeLeft').value='';$('#gaugeRight').value='';$('#imageInput').value='';selectedImage='';$('#imagePreview').classList.remove('show');$('#previewImg').removeAttribute('src');
    selectedCategory='流行・話題';selectedFormat='choice';
    $$('#categoryRow .type-btn').forEach(x=>x.classList.toggle('active',x.dataset.category===selectedCategory));
    $$('#formatRow .type-btn').forEach(x=>x.classList.toggle('active',x.dataset.format===selectedFormat));
    updateFormMode();
  }
  function updateFormMode(){
    const choice=selectedFormat==='choice';$('#choiceField').hidden=!choice;$('#gaugeField').hidden=choice;
    $('#previewLeft').textContent=$('#gaugeLeft').value.trim()||'左端の言葉';$('#previewRight').textContent=$('#gaugeRight').value.trim()||'右端の言葉';
  }
  function openPost(){resetForm();$('#postOverlay').classList.add('open')}
  function closePost(){if(!submitting)$('#postOverlay').classList.remove('open')}
  async function submitPost(){
    if(submitting)return;
    const q=$('#questionInput').value.trim(); if(!q){alert('お題を入力してください。');return}
    let a='',b='',l='',r='';
    if(selectedFormat==='choice'){a=$('#choiceA').value.trim();b=$('#choiceB').value.trim();if(!a||!b){alert('選択肢を2つ入力してください。');return}}
    else{l=$('#gaugeLeft').value.trim();r=$('#gaugeRight').value.trim();if(!l||!r){alert('ゲージの左右の言葉を入力してください。');return}}
    submitting=true;const button=$('#submitPost');button.disabled=true;button.textContent='投稿中…';
    const post={id:uid(),category:selectedCategory,format:selectedFormat,question:q,createdAt:Date.now()};
    if(selectedFormat==='choice'){post.a=a;post.b=b;post.votesA=0;post.votesB=0}else{post.leftLabel=l;post.rightLabel=r;post.gaugeValues=[]}
    if(selectedImage)post.image=selectedImage;
    try{posts.unshift(post);savePosts();$('#postOverlay').classList.remove('open');resetForm();category='all';$$('.tab').forEach(t=>t.classList.toggle('active',t.dataset.cat==='all'));render();$('#feed').scrollTo({top:0,behavior:'instant'})}
    catch(e){submitting=false;button.disabled=false;button.textContent='投稿する';alert('投稿の保存に失敗しました。')}
  }

  $('#openPost').addEventListener('click',openPost);$('#closePost').addEventListener('click',closePost);$('#submitPost').addEventListener('click',submitPost);
  $$('#categoryRow .type-btn').forEach(b=>b.addEventListener('click',()=>{selectedCategory=b.dataset.category;$$('#categoryRow .type-btn').forEach(x=>x.classList.toggle('active',x===b))}));
  $$('#formatRow .type-btn').forEach(b=>b.addEventListener('click',()=>{selectedFormat=b.dataset.format;$$('#formatRow .type-btn').forEach(x=>x.classList.toggle('active',x===b));updateFormMode()}));
  $('#gaugeLeft').addEventListener('input',updateFormMode);$('#gaugeRight').addEventListener('input',updateFormMode);
  $('#imageInput').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{selectedImage=r.result;$('#previewImg').src=selectedImage;$('#imagePreview').classList.add('show')};r.readAsDataURL(f)});
  $('#removeImage').addEventListener('click',()=>{selectedImage='';$('#imageInput').value='';$('#imagePreview').classList.remove('show');$('#previewImg').removeAttribute('src')});
  $$('.tab').forEach(t=>t.addEventListener('click',()=>{category=t.dataset.cat;$$('.tab').forEach(x=>x.classList.toggle('active',x===t));render();$('#feed').scrollTo({top:0,behavior:'instant'})}));
  $('#feed').addEventListener('scroll',()=>{const h=$('#feed').clientHeight||innerHeight;const i=Math.round($('#feed').scrollTop/h);const list=visiblePosts();if(list.length)$('#counter').textContent=`${Math.min(i+1,list.length)} / ${list.length}`});
  render();
})();
</script>
</body>
</html>
